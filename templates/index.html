<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-zinc-900 min-h-screen">

    <nav class="bg-zinc-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-3">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold">
                    <i class="fa-solid fa-link text-yellow-400"></i>
                    URL Shortener
                </h1>
                <div class="flex gap-6">
                    <a href="index.html" class="hover:text-yellow-300">Home</a>
                    <a href="about.html" class="hover:text-yellow-300">About</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex justify-center items-center px-4 py-12">
        <div class="w-full max-w-md bg-zinc-700 shadow-xl rounded-2xl p-6">
            <h2 class="text-3xl font-bold text-center text-white mb-6">Shorten Your URL</h2>

            <div class="space-y-4">
                <input type="text" id="urlInput" 
                    placeholder="https://example.com/your-long-url" 
                    class="w-full px-4 py-3 border-2 border-zinc-400 rounded-xl bg-zinc-800 text-white">

                <button onclick="shortenURL()" id="shortenBtn"
                    class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700">
                    <i class="fa-solid fa-link mr-2"></i> Shorten URL
                </button>
            </div>

            <div id="result" class="hidden mt-6"></div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-5 py-2 rounded-full text-sm opacity-0 transition-all duration-300 pointer-events-none z-50">
        <span id="toastMessage">Copied!</span>
    </div>

    <script>
        const BACKEND_URL = window.location.origin;

        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            const toastMessage = document.getElementById("toastMessage");
            toastMessage.innerText = message;
            toast.classList.remove("bg-green-600", "bg-red-600");
            toast.classList.add(isError ? "bg-red-600" : "bg-green-600");
            toast.classList.add("opacity-100");
            setTimeout(() => toast.classList.remove("opacity-100"), 3000);
        }

        async function copyToClipboard(text, btn) {
            await navigator.clipboard.writeText(text);
            showToast("Copied!");
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fa-regular fa-check-circle"></i> Copied!';
            setTimeout(() => btn.innerHTML = original, 1500);
        }

        function basicUrlCheck(url) {
            if (!url.trim()) return { valid: false, reason: "Please enter a URL" };
            let formatted = url.trim();
            if (!formatted.startsWith('http')) formatted = 'https://' + formatted;
            try {
                new URL(formatted);
                return { valid: true, formattedUrl: formatted };
            } catch {
                return { valid: false, reason: "Invalid URL format" };
            }
        }

        async function shortenURL() {
            const urlInput = document.getElementById("urlInput");
            const rawUrl = urlInput.value.trim();
            const resultDiv = document.getElementById("result");
            const shortenBtn = document.getElementById("shortenBtn");

            const check = basicUrlCheck(rawUrl);
            if (!check.valid) {
                showToast(check.reason, true);
                return;
            }

            shortenBtn.disabled = true;
            shortenBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Shortening...';

            try {
                const response = await fetch(`${BACKEND_URL}/shorten`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: check.formattedUrl })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || "Failed");

                resultDiv.classList.remove("hidden");
                resultDiv.innerHTML = `
                    <div class="bg-zinc-600 rounded-xl p-4 mt-4">
                        <p class="text-green-400 mb-2">✅ ${data.message}</p>
                        <div class="flex gap-2 flex-wrap">
                            <code class="bg-zinc-800 px-3 py-2 rounded text-blue-400 break-all flex-1">${data.short_url}</code>
                            <button onclick="copyToClipboard('${data.short_url}', this)" 
                                class="bg-gray-600 hover:bg-gray-500 px-4 py-2 rounded">Copy</button>
                        </div>
                    </div>
                `;
                showToast("URL shortened!");
            } catch (error) {
                showToast(error.message, true);
            } finally {
                shortenBtn.disabled = false;
                shortenBtn.innerHTML = '<i class="fa-solid fa-link mr-2"></i> Shorten URL';
            }
        }

        document.getElementById("urlInput")?.addEventListener("keypress", (e) => {
            if (e.key === "Enter") shortenURL();
        });
    </script>
</body>
</html>
